<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minijuegos</title>
    <link rel="stylesheet" href="CSS/styles.css">
</head>

<body class="arcade-page">

    <header class="header arcade-header">
        <h1>Minijuegos</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="Farmacos/menu.html">Fármacos</a>
            <a href="referencias.html">Referencias</a>
        </nav>
    </header>

    <main class="arcade-grid">
        <a href="Minijuegos/quiz.html" class="arcade-card arcade-card-link">
            <img src="Ilustraciones/Quiz.jpg" alt="Quiz farmacológico">
            <div class="arcade-card-copy">
                <h2>Quiz farmacológico</h2>
            </div>
        </a>

        <a href="Minijuegos/atinale-al-receptor.html" class="arcade-card arcade-card-link">
            <img src="Ilustraciones/AAR.jpeg" alt="Atínale al receptor">
            <div class="arcade-card-copy">
                <h2>Atínale al receptor</h2>
            </div>
        </a>

        <a href="Minijuegos/drag-and-drop.html" class="arcade-card arcade-card-link">
            <img src="Ilustraciones/DAD.png" alt="Arrastra y suelta el mecanismo">
            <div class="arcade-card-copy">
                <h2>Arrastra y suelta el mecanismo</h2>
            </div>
        </a>

        <a href="Minijuegos/mecanismo-en-la-mira.html" class="arcade-card arcade-card-link">

            <div class="arcade-card-copy">
                <h2>Mecanismo en la mira</h2>
            </div>
        </a>

        <a href="Minijuegos/memorama.html" class="arcade-card arcade-card-link">

            <div class="arcade-card-copy">
                <h2>Memorama farmacológico</h2>
            </div>
        </a>

        <button id="soon-card" class="arcade-card arcade-card-soon" type="button">
            <div class="arcade-pulse"></div>
            <div class="arcade-card-copy">
                <h2>Próximamente...</h2>
            </div>
        </button>
    </main>

    <div id="fnaf-overlay" class="fnaf-overlay hidden" aria-hidden="true">
        <video id="fnaf-video" src="Videos/fnaf.mp4" playsinline></video>
    </div>

    <script src="JS/minijuegos.js"></script>
</body>
</html>
